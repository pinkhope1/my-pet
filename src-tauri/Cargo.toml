[package]
name = "mypet"
version = "0.1.0"
edition = "2021"
description = "Cute glossy desktop dog pet"
license = "MIT"
authors = ["MyPet Contributors"]

[lib]
name = "mypet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
