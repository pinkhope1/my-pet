<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="1024" height="1024">
  <defs>
    <radialGradient id="g-fur" cx="38%" cy="28%" r="80%">
      <stop offset="0" stop-color="#f6cf9f"/>
      <stop offset="0.45" stop-color="#f2b366"/>
      <stop offset="1" stop-color="#d98a3d"/>
    </radialGradient>
    <radialGradient id="g-body" cx="40%" cy="25%" r="85%">
      <stop offset="0" stop-color="#f6cf9f"/>
      <stop offset="0.5" stop-color="#f2b366"/>
      <stop offset="1" stop-color="#d98a3d"/>
    </radialGradient>
    <radialGradient id="g-ear" cx="35%" cy="25%" r="90%">
      <stop offset="0" stop-color="#d9a272"/>
      <stop offset="0.5" stop-color="#c9772b"/>
      <stop offset="1" stop-color="#d98a3d"/>
    </radialGradient>
    <radialGradient id="g-muzzle" cx="42%" cy="30%" r="80%">
      <stop offset="0" stop-color="#fff7ea"/>
      <stop offset="0.6" stop-color="#fff1d9"/>
      <stop offset="1" stop-color="#f9e0c0"/>
    </radialGradient>
    <radialGradient id="g-nose" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#9d9496"/>
      <stop offset="0.45" stop-color="#3a2a2e"/>
      <stop offset="1" stop-color="#3a2a2e"/>
    </radialGradient>
    <radialGradient id="g-eye" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#4a3a40"/>
      <stop offset="0.6" stop-color="#2b1d22"/>
      <stop offset="1" stop-color="#2b1d22"/>
    </radialGradient>
    <radialGradient id="g-cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff7a8a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7a8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-tongue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8fa3"/>
      <stop offset="1" stop-color="#e5576f"/>
    </linearGradient>
  </defs>
<rect x="0" y="0" width="300" height="300" rx="60" fill="#cfe8ff"/>

  <!-- Тень на земле -->
  

  <!-- Хвост -->
  <g id="tail">
    <path d="M205 250 C 245 250, 268 222, 258 190 C 254 178, 240 178, 240 190 C 244 212, 232 228, 205 232 Z"
          fill="url(#g-fur)"/>
    <path d="M250 186 C 254 196, 252 204, 248 210" fill="none" stroke="#fff" stroke-opacity="0.55"
          stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Тело -->
  <g id="body">
    <ellipse cx="150" cy="222" rx="72" ry="62" fill="url(#g-body)"/>
    <ellipse cx="150" cy="238" rx="42" ry="42" fill="url(#g-muzzle)"/>
    <ellipse cx="128" cy="190" rx="26" ry="12" fill="url(#g-gloss)" transform="rotate(-18 128 190)" opacity="0.7"/>
  </g>

  <!-- Лапки -->
  <g id="paws">
    <g id="paw-left">
      <ellipse cx="116" cy="276" rx="24" ry="15" fill="url(#g-body)"/>
      <ellipse cx="108" cy="270" rx="9" ry="4" fill="#fff" opacity="0.5"/>
      <path d="M110 281 v-6 M118 282 v-7 M126 281 v-6" stroke="#d98a3d" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    </g>
    <g id="paw-right">
      <ellipse cx="184" cy="276" rx="24" ry="15" fill="url(#g-body)"/>
      <ellipse cx="176" cy="270" rx="9" ry="4" fill="#fff" opacity="0.5"/>
      <path d="M174 281 v-6 M182 282 v-7 M190 281 v-6" stroke="#d98a3d" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>

  <!-- Голова -->
  <g id="head">
    <!-- Уши (висячие) -->
    <g id="ears">
      <g id="ear-left">
        <path d="M82 78 C 40 70, 22 120, 38 162 C 48 186, 76 176, 84 148 C 92 122, 96 96, 82 78 Z" fill="url(#g-ear)"/>
        <path d="M46 106 C 44 126, 48 144, 56 156" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
      </g>
      <g id="ear-right">
        <path d="M218 78 C 260 70, 278 120, 262 162 C 252 186, 224 176, 216 148 C 208 122, 204 96, 218 78 Z" fill="url(#g-ear)"/>
        <path d="M254 106 C 256 126, 252 144, 244 156" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Лицо -->
    <ellipse id="face" cx="150" cy="130" rx="92" ry="80" fill="url(#g-fur)"/>
    <!-- Глянцевый блик на лбу -->
    <ellipse cx="116" cy="74" rx="46" ry="17" fill="url(#g-gloss)" transform="rotate(-16 116 74)"/>
    <!-- Морда -->
    <ellipse id="muzzle" cx="150" cy="160" rx="46" ry="35" fill="url(#g-muzzle)"/>
    <!-- Румянец -->
    <ellipse cx="94" cy="150" rx="20" ry="13" fill="url(#g-cheek)"/>
    <ellipse cx="206" cy="150" rx="20" ry="13" fill="url(#g-cheek)"/>

    <!-- Брови -->
    <g id="brows">
      <path id="brow-left"  d="M102 96 Q118 88 134 95" fill="none" stroke="#d98a3d" stroke-width="5" stroke-linecap="round"/>
      <path id="brow-right" d="M166 95 Q182 88 198 96" fill="none" stroke="#d98a3d" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Глаза -->
    <g id="eyes">
      <g id="eyes-open">
        <g id="eye-left">
          <ellipse cx="118" cy="121" rx="15" ry="17" fill="url(#g-eye)"/>
          <ellipse cx="123" cy="114" rx="5.5" ry="6.5" fill="#fff" opacity="0.95"/>
          <circle cx="112" cy="128" r="3" fill="#fff" opacity="0.6"/>
        </g>
        <g id="eye-right">
          <ellipse cx="182" cy="121" rx="15" ry="17" fill="url(#g-eye)"/>
          <ellipse cx="187" cy="114" rx="5.5" ry="6.5" fill="#fff" opacity="0.95"/>
          <circle cx="176" cy="128" r="3" fill="#fff" opacity="0.6"/>
        </g>
      </g>
      <!-- Альтернативы для FSM (меняем видимость классом .hidden) -->
      <g id="eyes-happy" display="none" fill="none" stroke="#2b1d22" stroke-width="6" stroke-linecap="round">
        <path d="M103 126 Q118 104 133 126"/>
        <path d="M167 126 Q182 104 197 126"/>
      </g>
      <g id="eyes-closed" display="none" fill="none" stroke="#2b1d22" stroke-width="5.5" stroke-linecap="round">
        <path d="M103 122 Q118 134 133 122"/>
        <path d="M167 122 Q182 134 197 122"/>
      </g>
    </g>

    <!-- Нос -->
    <g id="nose">
      <ellipse cx="150" cy="143" rx="16" ry="11.5" fill="url(#g-nose)"/>
      <ellipse cx="144" cy="138.5" rx="6" ry="3.2" fill="#fff" opacity="0.8"/>
    </g>

    <!-- Рот -->
    <g id="mouth">
      <path id="mouth-smile" d="M150 154 L150 162 M150 162 Q137 177 124 165 M150 162 Q163 177 176 165"
            fill="none" stroke="#3a2a2e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="tongue" display="none" d="M142 170 Q150 192 158 170 Z" fill="url(#g-tongue)"/>
    </g>
  </g>

  <!-- Слой эффектов: сердечки, злость, Zzz (будут добавлены в шаге 4) -->
  <g id="fx"></g>
</svg>